<!DOCTYPE html>
<html>
<head>
    <title>Edit Member</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <h2>GYM MANAGEMENT</h2>

    <div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('members') }}">Members</a>
        <a href="{{ url_for('membership') }}">Membership</a>
        <a href="{{ url_for('payments') }}">Payments</a>
        <a href="{{ url_for('attendance') }}">Attendance</a>
        <a href="{{ url_for('trainers') }}">Trainers</a>
        <a href="{{ url_for('reports') }}">Reports</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>

<div class="form-container">

    <h1>Edit Member</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ member.name }}"
            required
        >

        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ member.phone }}"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ member.email }}"
        >

        <label>Age</label>

        <input
            type="number"
            name="age"
            value="{{ member.age }}"
        >

        <label>Gender</label>

        <select name="gender">

            <option value="Male"
                {% if member.gender == 'Male' %}selected{% endif %}>
                Male
            </option>

            <option value="Female"
                {% if member.gender == 'Female' %}selected{% endif %}>
                Female
            </option>

            <option value="Other"
                {% if member.gender == 'Other' %}selected{% endif %}>
                Other
            </option>

        </select>

        <button type="submit">Update Member</button>

        <a class="cancel" href="{{ url_for('members') }}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
