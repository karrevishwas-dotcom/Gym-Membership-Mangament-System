<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <h2>GYM MANAGEMENT</h2>

    <div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('members') }}">Members</a>
        <a href="{{ url_for('membership') }}">Membership</a>
        <a href="{{ url_for('payments') }}">Payments</a>
        <a href="{{ url_for('attendance') }}">Attendance</a>
        <a href="{{ url_for('trainers') }}">Trainers</a>
        <a href="{{ url_for('reports') }}">Reports</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>

<div class="container">

    <h1>Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Members</h3>
            <p>{{ total_members }}</p>
        </div>

        <div class="card">
            <h3>Active Memberships</h3>
            <p>{{ active_memberships }}</p>
        </div>

        <div class="card">
            <h3>Total Trainers</h3>
            <p>{{ total_trainers }}</p>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <p>₹{{ total_revenue }}</p>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
