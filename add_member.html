<!DOCTYPE html>
<html>
<head>
    <title>Add Member</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <h2>GYM MANAGEMENT</h2>

    <div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('members') }}">Members</a>
        <a href="{{ url_for('membership') }}">Membership</a>
        <a href="{{ url_for('payments') }}">Payments</a>
        <a href="{{ url_for('attendance') }}">Attendance</a>
        <a href="{{ url_for('trainers') }}">Trainers</a>
        <a href="{{ url_for('reports') }}">Reports</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>

<div class="form-container">

    <h1>Add New Member</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Phone</label>
        <input type="text" name="phone" required>

        <label>Email</label>
        <input type="email" name="email">

        <label>Age</label>
        <input type="number" name="age">

        <label>Gender</label>

        <select name="gender">

            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>

        </select>

        <button type="submit">Add Member</button>

        <a class="cancel" href="{{ url_for('members') }}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
